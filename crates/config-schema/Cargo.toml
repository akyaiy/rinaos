[package]
name = "rinasys-config-schema"
version = "0.1.0"
edition = "2021"

[features]
default = []
codegen = ["dep:proc-macro2", "dep:quote", "dep:rinasys-config-derive"]
serde = ["dep:serde"]

[dependencies]
proc-macro2 = { version = "1", optional = true }
quote = { version = "1", optional = true }
rinasys-config-derive = { path = "../config-derive", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
