[package]
name = "rinasys-kernel"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kernel"
path = "src/kmain.rs"

[dependencies]
rinasys-config-schema = { path = "../crates/config-schema" }
limine = "0.x"
x86_64 = "0.15.4"
spin = "0.9"
lazy_static = { version = "1.5", features = ["spin_no_std"] }
pc-keyboard = "0.8"

[build-dependencies]
rinasys-config-codegen = { path = "../crates/config-codegen" }
